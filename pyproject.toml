[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parity"
version = "0.1.0"
description = "Make every machine match. A CLI tool to diagnose and fix Python environment differences."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "packaging>=23.0",
    "pathspec>=0.11.0"
]

[project.scripts]
parity = "parity.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "ruff>=0.1.0",
    "mypy>=1.0"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = false
warn_return_any = true
warn_unused_configs = true
